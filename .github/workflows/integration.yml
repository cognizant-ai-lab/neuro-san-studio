name: Integration Test

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # cognizant-ai-lab/build-common 1.0.12
    uses: cognizant-ai-lab/build-common/.github/workflows/_python-quality-gate.yml@3f4cdab31b6ac10382c99452b720eb0b8b2dab8f
    with:
      python-version: '3.12'
      # No lint steps in the original workflow
      lint-command-override: 'true'
      run-pytest: false
      test-command-override: >-
        export OPENAI_API_VERSION="${{ vars.OPENAI_API_VERSION }}" &&
        export AGENT_TOOL_PATH="coded_tools/" &&
        export AGENT_MANIFEST_FILE="registries/manifest.hocon" &&
        export AGENT_TOOLBOX_INFO_FILE="neuro_san_studio/toolbox/toolbox_info.hocon" &&
        export PYTHONPATH="${PYTHONPATH:+$PYTHONPATH:}." &&
        pytest --capture=no -m "integration"
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
