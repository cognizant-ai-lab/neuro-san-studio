name: Publish to PyPI

permissions:
    contents: read
    id-token: write

on:
  release:
    types: [published]  # Trigger only when a GitHub Release is published.

jobs:
  publish:
    name: Build and Publish
    # don't run this job in sync'd clones
    if: github.repository == 'cognizant-ai-lab/neuro-san-studio'
    # build-common 1.0.9
    uses: cognizant-ai-lab/build-common/.github/workflows/_publish-pypi.yml@b14b3de23cb9aca02b2165e57542335e0c8f5304
    with:
      python-version: '3.10'
      enable-slack: true
      build-common-ref: b14b3de23cb9aca02b2165e57542335e0c8f5304
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
